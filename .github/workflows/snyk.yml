name: Snyk security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fail clearly if the token is missing
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::SNYK_TOKEN repository secret is not set"
            exit 1
          fi

      - name: Install dependencies (so Snyk resolves the real dependency tree)
        run: |
          pip install -r services/api/requirements.txt
          npm ci --prefix apps/web

      - uses: snyk/actions/setup@master

      # SCA: known-vulnerable dependencies (Python + npm). Fails on high or critical.
      - name: Snyk Open Source (SCA)
        run: snyk test --all-projects --severity-threshold=high --exclude=node_modules,.venv,.aws-sam

      # SAST: insecure patterns in our own source. Fails on high or above.
      - name: Snyk Code (SAST)
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif

      - name: Upload SAST results
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
