name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/requirements*.txt
            agents/requirements.txt
      - run: pip install -r services/api/requirements.txt -r services/api/requirements-dev.txt -r agents/requirements.txt
      - run: python -m pytest tests -q
